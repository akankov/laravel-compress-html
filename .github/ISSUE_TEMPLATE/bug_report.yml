name: Bug report
description: Report incorrect Blade directive output, middleware misbehavior, or provider wiring failure.
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include the smallest Blade template, response, or container scenario that reproduces the problem.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight
      options:
        - label: I have searched existing issues.
          required: true
        - label: This is not a security vulnerability. I will use SECURITY.md for security reports.
          required: true

  - type: input
    id: version
    attributes:
      label: Package version
      description: Run `composer show akankov/laravel-compress-html` or provide the commit SHA.
      placeholder: "0.1.0 or abc1234"
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.3.12"
    validations:
      required: true

  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
      description: Run `composer show laravel/framework`.
      placeholder: "12.0.0"
    validations:
      required: true

  - type: textarea
    id: htmlmin-config
    attributes:
      label: Published config overrides
      description: Paste any non-default keys from `config/htmlmin.php`, or write "defaults".
      placeholder: "defaults"
      render: php

  - type: textarea
    id: input
    attributes:
      label: Input (template, route, or middleware setup)
      description: Smallest Blade template, route definition, or container scenario that reproduces the problem.
      render: php
    validations:
      required: true

  - type: textarea
    id: actual-output
    attributes:
      label: Actual rendered output (or response body)
      render: html
    validations:
      required: true

  - type: textarea
    id: expected-output
    attributes:
      label: Expected rendered output (or response body)
      render: html
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add stack traces, container resolution errors, or links if relevant.
