name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: PHP ${{ matrix.php }} x Laravel ${{ matrix.laravel }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        laravel: ["12.*", "13.*"]
    timeout-minutes: 10
    env:
      PHP_VERSION: ${{ matrix.php }}
      LARAVEL_VERSION: ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: dom, libxml, mbstring
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.laravel }}-

      - name: Constrain Laravel version
        run: |
          composer require \
            "illuminate/support:$LARAVEL_VERSION" \
            "illuminate/contracts:$LARAVEL_VERSION" \
            "illuminate/http:$LARAVEL_VERSION" \
            "illuminate/view:$LARAVEL_VERSION" \
            --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  coverage:
    name: Line coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: pcov
          extensions: dom, libxml, mbstring
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-8.4-${{ hashFiles('composer.json') }}
          restore-keys: composer-8.4-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      # Floor mirrors the Makefile (MIN_LINE_COVERAGE).
      - name: Line coverage floor
        run: |
          vendor/bin/phpunit --coverage-clover build/coverage/clover.xml --coverage-text --only-summary-for-coverage-text
          php bin/coverage-check.php build/coverage/clover.xml 100

      - name: Run mutation testing and enforce the MSI floor
        run: make infection

  static-analysis:
    name: PHPStan (level max)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: dom, libxml, mbstring
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-8.4-${{ hashFiles('composer.json') }}
          restore-keys: composer-8.4-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  rector-check:
    name: Rector dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: dom, libxml, mbstring
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-8.4-${{ hashFiles('composer.json') }}
          restore-keys: composer-8.4-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run Rector (dry-run)
        run: vendor/bin/rector process --dry-run

  code-style:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: dom, libxml, mbstring
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-8.4-${{ hashFiles('composer.json') }}
          restore-keys: composer-8.4-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: dom, libxml, mbstring
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      # Non-blocking: reports known advisories on every run. It does not fail the
      # build — composer.lock is not committed (deps resolve fresh each run), and
      # transitive/upstream advisories the package cannot directly fix should not
      # wedge unrelated PRs. Dependabot drives the actual dependency bumps.
      - name: composer audit
        run: composer audit --no-interaction
        continue-on-error: true
